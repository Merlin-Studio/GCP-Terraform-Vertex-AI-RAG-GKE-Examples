# Ingress: GKE control plane communication
#
# Compliance:
#   ISO 27001: A.8.22 Segregation of networks — managed exception for platform service control plane traffic
#   GDPR: Art. 28(1) Processor obligations — authorized managed service provider access
#   CIS Benchmarks: CIS GCP 6.x GKE — GKE cluster access through authorized control plane only
#   NIS2 Directive: Art. 21(2)(a) Risk analysis — managed service exception for control plane
#
# GKE control plane runs outside the perimeter in Google-managed infra.
# Without this rule, kubectl and GKE API calls fail.
#
# Project-factory projects are not known to the 1-vpcsc stage, so this
# rule admits any service account; narrow it to the GKE service agents
# (serviceAccount:service-<project-number>@container-engine-robot.iam.gserviceaccount.com)
# once the GKE projects exist.
#
# ARCHITECT TODO:
# - [ ] Narrow identities to the GKE service agents of: vendora-gke-dev-0, vendora-gke-stg-0, vendora-gke-prd-0

from:
  access_levels:
  - '*'
  identity_type: ANY_SERVICE_ACCOUNT
to:
  operations:
  - service_name: container.googleapis.com
  - service_name: compute.googleapis.com
  - service_name: artifactregistry.googleapis.com
  resources:
  - '*'
